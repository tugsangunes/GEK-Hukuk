.me<h1>KVKK Aydınlatma Metni</h1>
<p class="meta">Son güncelleme: <span class="ph">Ekim 2026</span></p>

<p>Bu metin, 6698 sayılı Kişisel Verilerin Korunması Kanunu’nun (“KVKK”) 10. maddesi ve Aydınlatma Yükümlülüğünün Yerine Getirilmesinde Uyulacak Usul ve Esaslar Hakkında Tebliğ uyarınca, gekhukuk.com internet sitesini ziyaret eden ve bu site üzerinden bizimle iletişime geçen kişileri bilgilendirmek amacıyla hazırlanmıştır.</p>
<p>Büromuzla avukatlık hizmeti ilişkisi kuran müvekkillerimizin kişisel verilerine ilişkin bilgilendirme, vekâlet ilişkisinin kurulması sırasında ayrıca yapılır.</p>

<h2>1. Veri sorumlusu</h2>
<p>Av. Tuğsan Güneş, Av. Ömer Murat Erdil ve Av. Adem Karakaya (GEK Hukuk Bürosu)<br>
Reşatbey Mah. 62006 Sk. No:5 Arun Apt. Kat:5 Daire:14 Seyhan / Adana<br>
E-posta: info@gekhukuk.com · Telefon: +90 532 292 10 72</p>
<p>Büromuzdaki avukatlar, bu metin kapsamındaki kişisel veriler bakımından birlikte veri sorumlusudur.</p>

<h2>2. İşlenen kişisel veriler</h2>
<ul>
<li><strong>Kimlik ve iletişim bilgileri:</strong> İletişim formunda veya e-posta ile ilettiğiniz ad, soyad ve e-posta adresi; telefonla ulaşmanız hâlinde telefon numaranız.</li>
<li><strong>Talep içeriği:</strong> Mesajınızda yer verdiğiniz bilgiler.</li>
<li><strong>İşlem güvenliği bilgileri:</strong> Siteyi ziyaretiniz sırasında barındırma hizmeti sağlayıcısı tarafından tutulan IP adresi, tarih-saat ve tarayıcı bilgisi gibi kayıtlar.</li>
</ul>
<p>Lütfen iletişim formu veya e-posta yoluyla sağlık, ceza mahkûmiyeti gibi özel nitelikli kişisel verilerinizi ya da hukuki uyuşmazlığınıza ilişkin ayrıntılı bilgileri paylaşmayınız. Bu bilgiler, görüşme sırasında ve gizlilik içinde ayrıca alınır.</p>

<h2>3. İşleme amaçları</h2>
<ul>
<li>İletişim ve bilgi taleplerinizin alınması ve yanıtlanması,</li>
<li>Talep etmeniz hâlinde görüşme planlanması ve avukatlık hizmeti ilişkisinin kurulmasına yönelik ön değerlendirme,</li>
<li>İnternet sitesinin güvenliğinin sağlanması,</li>
<li>Mevzuattan doğan yükümlülüklerin yerine getirilmesi ve yetkili kurumların taleplerinin karşılanması.</li>
</ul>

<h2>4. Toplama yöntemi ve hukuki sebepler</h2>
<p>Kişisel verileriniz; internet sitesindeki iletişim formu, e-posta ve telefon yoluyla, kısmen otomatik yollarla elektronik ortamda toplanır. Veriler, KVKK’nın 5. maddesinin 2. fıkrasında yer alan şu hukuki sebeplere dayanılarak işlenir:</p>
<ul>
<li>(c) Bir sözleşmenin kurulması veya ifasıyla doğrudan ilgili olması: avukatlık hizmetine ilişkin taleplerinizin değerlendirilmesi,</li>
<li>(ç) Veri sorumlusunun hukuki yükümlülüğünü yerine getirebilmesi için zorunlu olması,</li>
<li>(e) Bir hakkın tesisi, kullanılması veya korunması için zorunlu olması,</li>
<li>(f) İlgili kişinin temel hak ve özgürlüklerine zarar vermemek kaydıyla, veri sorumlusunun meşru menfaatleri için zorunlu olması: taleplerin yanıtlanması ve site güvenliği.</li>
</ul>
<p>Bu hukuki sebepler mevcut olduğundan, iletişim talepleriniz için ayrıca açık rızanız alınmamaktadır.</p>

<h2>5. Kişisel verilerin aktarılması</h2>
<p>Kişisel verileriniz, yukarıdaki amaçlarla sınırlı olarak ve KVKK’nın 8. ve 9. maddelerine uygun şekilde;</p>
<ul>
<li>Talep hâlinde yetkili kamu kurum ve kuruluşları ile yargı mercilerine,</li>
<li>İnternet sitesinin barındırma ve e-posta hizmetlerini sağlayan iş ortaklarımıza</li>
</ul>
<p>aktarılabilir.</p>
<p><strong>Yurt dışına aktarım:</strong> Barındırma ve e-posta hizmeti sağlayıcılarımızın sunucuları yurt dışında bulunduğundan, iletişim talepleriniz kapsamındaki kişisel verileriniz bu hizmetlerin sunulması amacıyla yurt dışına aktarılmaktadır. Bu aktarım, KVKK’nın 9. maddesinde öngörülen uygun güvencelerden biri olan, Kişisel Verileri Koruma Kurulu tarafından ilan edilen standart sözleşme imzalanarak gerçekleştirilir.</p>
<p class="ph">Kontrol edin (yayından önce bu kutuyu silin): Her iki sağlayıcıyla da Kurul’un standart sözleşmesinin imzalanmış ve imzadan sonra 5 iş günü içinde Kurum’a bildirilmiş olması gerekir. Sitenin yazı tipleri şu an Google sunucularından yüklenmektedir; yayından önce yazı tiplerinin sitenin kendi sunucusundan sunulmasını öneririz.</p>

<h2>6. Saklama süresi</h2>
<p>İletişim talepleri kapsamında işlenen kişisel veriler, talep sonuçlandıktan sonra 5 yıl süreyle saklanır; bu talep bir vekâlet ilişkisine dönüşürse, ilgili mevzuatta öngörülen süreler uygulanır. Süre sonunda veriler silinir, yok edilir veya anonim hâle getirilir.</p>

<h2>7. Haklarınız</h2>
<p>KVKK’nın 11. maddesi uyarınca büromuza başvurarak;</p>
<ul>
<li>Kişisel verilerinizin işlenip işlenmediğini öğrenme,</li>
<li>İşlenmişse buna ilişkin bilgi talep etme,</li>
<li>İşlenme amacını ve amacına uygun kullanılıp kullanılmadığını öğrenme,</li>
<li>Yurt içinde veya yurt dışında aktarıldığı üçüncü kişileri bilme,</li>
<li>Eksik veya yanlış işlenmişse düzeltilmesini isteme,</li>
<li>KVKK’nın 7. maddesindeki şartlar çerçevesinde silinmesini veya yok edilmesini isteme,</li>
<li>Düzeltme, silme ve yok etme işlemlerinin, verilerin aktarıldığı üçüncü kişilere bildirilmesini isteme,</li>
<li>İşlenen verilerin münhasıran otomatik sistemler vasıtasıyla analiz edilmesi suretiyle aleyhinize bir sonucun ortaya çıkmasına itiraz etme,</li>
<li>Kanuna aykırı işleme sebebiyle zarara uğramanız hâlinde zararın giderilmesini talep etme</li>
</ul>
<p>haklarına sahipsiniz.</p>

<h2>8. Başvuru yöntemi</h2>
<p>Taleplerinizi, Veri Sorumlusuna Başvuru Usul ve Esasları Hakkında Tebliğ’e uygun olarak; kimliğinizi gösteren bilgilerle birlikte yazılı olarak yukarıdaki adrese elden veya posta yoluyla ya da büromuzda kayıtlı e-posta adresinizden info@gekhukuk.com adresine iletebilirsiniz. Başvurular, talebin niteliğine göre en kısa sürede ve en geç otuz gün içinde ücretsiz olarak sonuçlandırılır.</p>
rin Korunması Kanunu’nun 10. maddesi uyarınca hazırlanacak aydınlatma metni için ayrılmıştır. Veri sorumlusu, işlenen veriler, işleme amaçları, aktarım ve ilgili kişi hakları büro tarafından doldurulmalıdır.</p>
