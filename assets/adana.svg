<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Adana: Taşköprü ve Sabancı Merkez Camii, çizim">
<style>
@media (prefers-reduced-motion: no-preference) {
  .draw path, .draw circle { stroke-dasharray: 1; stroke-dashoffset: 1; animation: d 2.4s ease-out forwards; }
  .draw + .draw path { animation-delay: .5s; }
  g:not(.draw), svg > circle, svg > path { animation: f 1.6s ease-out .3s backwards; }
  /* Çizim bittikten sonra süren hafif hareket: güneş halesi, sudaki yansıma ve dalgalar */
  .halo { transform-origin: 130px 110px; animation: f 1.6s ease-out .3s backwards, halo 5s ease-in-out 2.5s infinite; }
  .refl path { animation: shimmer 3s linear infinite; }
  .water { animation: f 1.6s ease-out .3s backwards, drift 7s ease-in-out 2s infinite alternate; }
  .water path:nth-child(even) { animation: drift2 5s ease-in-out infinite alternate; }
}
@keyframes halo { 0%, 100% { transform: scale(1); opacity: .18; } 50% { transform: scale(1.12); opacity: .05; } }
@keyframes shimmer { to { stroke-dashoffset: -18; } }
@keyframes drift { from { transform: translateX(-10px); } to { transform: translateX(10px); } }
@keyframes drift2 { from { transform: translateX(8px); } to { transform: translateX(-8px); } }
@keyframes d { to { stroke-dashoffset: 0; } }
@keyframes f { from { opacity: 0; } }
</style>
